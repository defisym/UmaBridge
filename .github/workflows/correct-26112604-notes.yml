name: Correct 26112604 release notes
on:
  push:
    branches: [main]
    paths: [.github/workflows/correct-26112604-notes.yml]
permissions:
  contents: write
concurrency:
  group: publish-signed-apk
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: defisym/UmaBridge
    steps:
      - name: Update bilingual notes and manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cat > body.md <<'EOF'
          ### 中文
          
          - 上游 Clash 订阅及其远程节点集合优先直连，失败后通过 Android 默认网络重试。刷新诊断会记录直连和回退结果。
          - 手动快速刷新会拉取最新上游，用已保存的线路重新组链并测速一轮。
          
          ### English
          
          - Upstream Clash subscriptions and remote proxy providers try a direct connection first and fall back to Android’s default network if needed. Refresh diagnostics record the result of each attempt.
          - Manual quick refresh fetches the latest upstream configuration, rebuilds saved routes, and retests them once.
          EOF
          gh api "repos/$REPO/releases/latest" > release.json
          jq -e '.id == 458811942 and .tag_name == "v1.46-26112604" and (.draft or .prerelease | not)' release.json > /dev/null
          jq -e '.assets[] | select(.id == 793754678 and .digest == "sha256:5b3c738619764054d3a9775436234c4db5abe3942c48560b427d17ea6827423a") | {name,size,digest,browser_download_url}' release.json > apk.json
          old=$(jq -er '.assets[] | select(.name == "update.json" and .id == 793754737) | .id' release.json)
          jq -cn --rawfile body body.md --slurpfile apk apk.json '{tag_name:"v1.46-26112604",draft:false,prerelease:false,body:($body|rtrimstr("\n")),assets:$apk}' > manifest.json
          upload=$(jq -er '.upload_url | split("{")[0]' release.json)
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' --data-binary @manifest.json "$upload?name=update-notes-staged.json" > staged.json
          new=$(jq -er '.id' staged.json)
          expected="sha256:$(sha256sum manifest.json | cut -d' ' -f1)"
          jq -e --arg digest "$expected" '.state == "uploaded" and .digest == $digest' staged.json > /dev/null
          rename_asset() {
            gh api -X PATCH "repos/$REPO/releases/assets/$1" -f name="$2" > /dev/null
          }
          rename_asset "$old" update-notes-backup.json
          if ! rename_asset "$new" update.json; then
            rename_asset "$old" update.json
            exit 1
          fi
          if ! jq '{body}' manifest.json | gh api -X PATCH "repos/$REPO/releases/458811942" --input - > /dev/null; then
            rename_asset "$new" update-notes-staged.json
            rename_asset "$old" update.json
            exit 1
          fi
          gh api "repos/$REPO/releases/latest" > current.json
          jq -e --slurpfile expected manifest.json '.body == $expected[0].body and any(.assets[]; .id == 793754678 and .digest == $expected[0].assets[0].digest)' current.json > /dev/null
          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "https://github.com/$REPO/releases/latest/download/update.json?notes=$GITHUB_RUN_ID-$attempt" -o public.json && cmp -s manifest.json public.json; then
              gh api -X DELETE "repos/$REPO/releases/assets/$old"
              exit 0
            fi
            sleep 5
          done
          exit 1
